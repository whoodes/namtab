site_name: namtab
site_description: AI-first harness direction, owned terminal design and retained engineering evidence
site_dir: .artifacts/site
strict: true
theme:
  name: mkdocs
  navigation_depth: 3
markdown_extensions:
  - tables
  - fenced_code
