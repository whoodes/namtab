site_name: Project X
site_description: Local engineering evidence and agent-first terminal design
site_dir: .artifacts/site
strict: true
theme:
  name: mkdocs
  navigation_depth: 3
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
