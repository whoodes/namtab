site_name: namtab
site_description:
  AI-first terminal engine, native harness, user guide and engineering
  contracts
site_dir: .artifacts/site
strict: true
copyright: Original namtab material is Apache-2.0; upstream assets retain their terms.
theme:
  name: mkdocs
  navigation_depth: 3
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
