name: PR governance
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  governance:
    name: PR issue and commit policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify live association and PR-introduced commit messages
        run: node scripts/check-pr-governance.mjs
        env:
          GH_TOKEN: ${{ github.token }}
