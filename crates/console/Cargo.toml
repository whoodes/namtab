[package]
name = "project-x-console"
default-run = "project-x-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
project-x-client = { path = "../client" }
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true

# Native feedback slice: X11 software surface, not the final product renderer.
winit = { version = "=0.30.13", default-features = false, features = ["x11", "rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen"] }
fontdue = { version = "=0.9.3", default-features = false }
